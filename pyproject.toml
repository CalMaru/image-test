[project]
name = "image_test"
version = "0.1.0"
description = "A test tool to extract images from PDF files."
authors = [{ name = "Cal", email = "cal@42maru.ai"}]
requires-python = "==3.12.10"

dependencies = [
	"pymupdf==1.24.4",
	"pdf2image>=1.17.0,<2.0.0",
	"dependency-injector>=4.47.1,<5.0.0",
	"pydantic>=2.11.5,<3.0.0",
	"pydantic-settings>=2.9.1,<3.0.0",
	'uvloop>=0.19.0,<0.20.0; sys_platform != "win32"',
	"pdfplumber>=0.11.6,<0.12.0"
]

[tool.uv]
dev-dependencies = [
  "pre-commit>=3.8.0",
  "ruff>=0.5.5",
  "isort>=5.13.2"
]

[tool.isort]
profile = "black"
line_length = 155

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
